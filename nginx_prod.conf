# z:\aeterna.website\nginx_prod.conf (Реализиран архитектурен отрязък)
server {
    listen 80;
    server_name aeterna.website www.aeterna.website;
    return 301 https://$host$request_uri; # Автоматичен HTTP -> HTTPS редирект
}

server {
    listen 443 ssl http2;
    server_name aeterna.website www.aeterna.website;

    # Let's Encrypt TLS Спецификация
    ssl_certificate /etc/letsencrypt/live/aeterna.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeterna.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Строги защитни хедъри по NIS-2 / GDPR
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # Reverse Proxy към Bun Server (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Поддръжка за BCI WebSocket Телеметрия
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Пренос на реалните метаданни на купувача за Stripe валидация
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
