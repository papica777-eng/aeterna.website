[package]
name = "aeterna_hospital_shell"
version = "2.4.0"
description = "AETERNA-VHT Enterprise Hospital Desktop Client Shell"
authors = ["Dimitar Prodromov <dimitar@aeterna.website>"]
license = "Proprietary / Sovereign"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "api-all", "window-set-title", "clipboard-all", "dialog-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[features]
# default features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
