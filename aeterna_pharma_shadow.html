<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETERNA // PHARMA B2B & LONGEVITY ENGINE (SHADOW)</title>
    <link rel="icon" type="image/svg+xml" href="assets/aeterna_logo.svg">
    
    <!-- React & Babel Standalone (Fallback-Resilient) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Google Fonts for Medical HUD -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #02040a;
            --emerald-glass: rgba(9, 36, 24, 0.55);
            --emerald-border: rgba(0, 255, 170, 0.15);
            --emerald-glow: rgba(0, 255, 170, 0.25);
            
            --purple-glass: rgba(18, 9, 36, 0.55);
            --purple-border: rgba(181, 95, 230, 0.15);
            --purple-glow: rgba(181, 95, 230, 0.25);
            
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            
            --neon-purple: #b55fe6;
            --neon-pink: #ff2a85;
            --neon-emerald: #00ffaa;
            --neon-emerald-glow: rgba(0, 255, 170, 0.3);
            --neon-blue: #00f0ff;
            --neon-blue-glow: rgba(0, 240, 255, 0.3);
            --neon-red: #ff3b6f;
            --neon-red-glow: rgba(255, 59, 111, 0.4);
            --neon-amber: #ffb800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 170, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 70%, rgba(181, 95, 230, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--emerald-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--emerald-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card.purple-variant {
            background: var(--purple-glass);
            border: 1px solid var(--purple-border);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.05), transparent);
            transition: 0.8s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 170, 0.35);
            box-shadow: 0 0 35px var(--emerald-glow);
            transform: translateY(-2px);
        }

        .glass-card.purple-variant:hover {
            border-color: rgba(181, 95, 230, 0.35);
            box-shadow: 0 0 35px var(--purple-glow);
        }

        .tab-btn {
            background: rgba(0, 255, 170, 0.02);
            border: 1px solid var(--emerald-border);
            color: var(--text-secondary);
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-btn.active {
            border-color: var(--neon-emerald);
            color: #fff;
            background: rgba(0, 255, 170, 0.12);
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.2);
            transform: translateY(-1px);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            border-color: rgba(0, 255, 170, 0.3);
            background: rgba(0, 255, 170, 0.05);
        }

        .glow-text-emerald { text-shadow: 0 0 20px var(--neon-emerald-glow); }
        .glow-text-blue { text-shadow: 0 0 20px var(--neon-blue-glow); }
        .glow-text-red { text-shadow: 0 0 20px var(--neon-red-glow); }

        .cure-btn {
            background: linear-gradient(135deg, var(--neon-emerald), #00bb88);
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            padding: 16px 42px;
            border-radius: 50px;
            box-shadow: 0 0 35px rgba(0, 255, 170, 0.35);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
        }

        .cure-btn:hover {
            box-shadow: 0 0 50px rgba(0, 255, 170, 0.6);
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, #00ffbb, var(--neon-emerald));
        }

        .cure-btn:disabled {
            background: #333;
            box-shadow: none;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        /* Scanline Overlay for Medical Screen Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.15;
        }

        /* Top navigation header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(0, 255, 170, 0.1);
            background: rgba(4, 1, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <i data-lucide="dna" class="w-8 h-8 text-emerald-400 animate-pulse"></i>
            <h1 style="font-weight: 900; letter-spacing: 2px; font-size: 1.4rem;">
                AETERNA <span style="color: var(--neon-emerald);">// IN SILICO PHARMA & LONGEVITY</span>
            </h1>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;" class="mono text-sm">
            <span style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--neon-emerald); box-shadow: 0 0 10px var(--neon-emerald);"></div>
                PHARMA-LINK: SECURE
            </span>
            <span style="color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px;">
                B2B SHADOW INSTANCE
            </span>
        </div>
    </header>

    <div style="padding: 40px; max-width: 1600px; margin: 0 auto;" id="app-root">
        <!-- Rendered by Vanilla JS -->
    </div>

    <script>
        // System State
        let state = {
            activeTab: 'cohort', // 'cohort' or 'longevity'
            
            // Cohort State
            cohortStatus: 'IDLE', // 'IDLE', 'SCANNING_FDA', 'PROCESSING', 'COMPLETE', 'ERROR'
            scannedCount: 0,
            toxicCount: 0,
            safeCount: 0,
            cIndex: 0.00,
            fdaDrugName: 'DASATINIB (Sprycel / Senolytic)',

            // Longevity State
            longStatus: 'BASELINE', // 'BASELINE', 'CRISPR_EDITING', 'CRISPR_DONE', 'REPROGRAMMING', 'REVERSED'
            bioAge: 75.4,
            telomereLength: 4.12, // kbp
            senescentCells: 100, // percentage of baseline
            yamanakaActive: false,
            
            // DNA State (APOE4 -> APOE3)
            dnaSequence: "5'-...GCGGACATGGAGGACG<span class='text-red-500 font-bold'>T</span>GCGCGGCCGCCT...-3'",
            dnaRisk: "ВИСОК (APOE4 - Alzheimer's Risk)"
        };

        // Translations
        const t = {
            tabCohort: "ГЛОБАЛНА VHT БАНКА (LIVE FDA DATA)",
            tabLongevity: "ГЕНОМ & ЕПИГЕНЕТИКА (CRISPR)",
            btnScan: "ВРЪЗКА КЪМ OpenFDA API & СКРИНИНГ",
            btnScanStop: "РЕАЛНИТЕ ДАННИ СА ЗАРЕДЕНИ",
            btnCrispr: "СТАРТИРАЙ CRISPR-Cas9 РЕДАКЦИЯ (rs429358)",
            btnReprogram: "ИНЖЕКТИРАЙ YAMANAKA ФАКТОРИ (OSKM)",
            btnReset: "ВЪЗСТАНОВИ СТАРЕЕНЕТО"
        };

        let scanInterval = null;
        let longevityInterval = null;
        let crisprInterval = null;

        window.switchTab = function(tab) {
            state.activeTab = tab;
            renderHUD();
        };

        window.startCohortScan = async function() {
            if(state.cohortStatus !== 'IDLE') return;
            state.cohortStatus = 'SCANNING_FDA';
            renderHUD();

            try {
                // Fetch real data from US FDA API for Dasatinib
                const response = await fetch('https://api.fda.gov/drug/event.json?search=patient.drug.medicinalproduct:"dasatinib"&count=patient.reaction.reactionmeddrapt.exact');
                const data = await response.json();
                
                let totalReports = 0;
                let toxicReports = 0;
                
                // Define severe systemic toxicity terms to track
                const toxicTerms = ['HEPATOTOXICITY', 'CARDIAC FAILURE', 'RENAL FAILURE', 'MYOCARDIAL INFARCTION', 'ACUTE KIDNEY INJURY', 'PULMONARY HYPERTENSION', 'HEPATIC FAILURE'];

                data.results.forEach(item => {
                    totalReports += item.count;
                    if (toxicTerms.includes(item.term)) {
                        toxicReports += item.count;
                    }
                });

                state.cohortStatus = 'PROCESSING';
                renderHUD();

                // Simulate processing delay for visual effect
                let currentScanned = 0;
                scanInterval = setInterval(() => {
                    currentScanned += Math.floor(totalReports / 15); 
                    state.scannedCount = currentScanned;
                    
                    if (currentScanned >= totalReports) {
                        clearInterval(scanInterval);
                        state.scannedCount = totalReports;
                        state.toxicCount = toxicReports;
                        state.safeCount = totalReports - toxicReports;
                        // Calculate Predictive C-INDEX based on safety ratio
                        state.cIndex = (state.safeCount / totalReports) * 0.99; 
                        state.cohortStatus = 'COMPLETE';
                    }
                    renderHUD();
                }, 100);

            } catch (error) {
                console.error("FDA API Error", error);
                state.cohortStatus = 'ERROR';
                renderHUD();
            }
        };

        window.triggerCrispr = function() {
            if(state.longStatus !== 'BASELINE') return;
            state.longStatus = 'CRISPR_EDITING';
            renderHUD();

            let frame = 0;
            crisprInterval = setInterval(() => {
                frame++;
                if (frame === 1) {
                    state.dnaSequence = "5'-...GCGGACATGGAGGACG<span class='text-yellow-400 font-bold animate-ping'>_</span>GCGCGGCCGCCT...-3'";
                    state.dnaRisk = "РАЗРЯЗВАНЕ ОТ Cas9 ЕНЗИМ...";
                } else if (frame === 2) {
                    state.dnaSequence = "5'-...GCGGACATGGAGGACG<span class='text-blue-400 font-bold'>C</span>GCGCGGCCGCCT...-3'";
                    state.dnaRisk = "ВМЪКВАНЕ НА ЗДРАВ НУКЛЕОТИД (C)...";
                } else if (frame >= 3) {
                    state.dnaSequence = "5'-...GCGGACATGGAGGACG<span class='text-emerald-400 font-bold'>C</span>GCGCGGCCGCCT...-3'";
                    state.dnaRisk = "ОПТИМАЛЕН (APOE3 - Нискък Риск)";
                    state.longStatus = 'CRISPR_DONE';
                    clearInterval(crisprInterval);
                }
                renderHUD();
            }, 800);
        };

        window.triggerYamanaka = function() {
            if(state.longStatus !== 'CRISPR_DONE') return;
            state.longStatus = 'REPROGRAMMING';
            state.yamanakaActive = true;
            renderHUD();

            longevityInterval = setInterval(() => {
                state.bioAge -= 0.5;
                state.telomereLength += 0.04;
                state.senescentCells -= 1.2;

                if(state.bioAge <= 35.0) {
                    state.bioAge = 35.0;
                    state.telomereLength = 8.50;
                    state.senescentCells = 5.2;
                    state.longStatus = 'REVERSED';
                    clearInterval(longevityInterval);
                }
                renderHUD();
            }, 50);
        };

        window.resetLongevity = function() {
            state.longStatus = 'BASELINE';
            state.bioAge = 75.4;
            state.telomereLength = 4.12;
            state.senescentCells = 100;
            state.yamanakaActive = false;
            state.dnaSequence = "5'-...GCGGACATGGAGGACG<span class='text-red-500 font-bold'>T</span>GCGCGGCCGCCT...-3'";
            state.dnaRisk = "ВИСОК (APOE4 - Alzheimer's Risk)";
            renderHUD();
        };

        function renderHUD() {
            const root = document.getElementById("app-root");
            if(!root) return;

            let tabHeader = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div style="display: flex; gap: 16px;">
                        <button class="tab-btn ${state.activeTab === 'cohort' ? 'active' : ''}" onclick="switchTab('cohort')">
                            <i data-lucide="database" class="w-4 h-4 inline-block mr-2 text-emerald-400"></i>${t.tabCohort}
                        </button>
                        <button class="tab-btn ${state.activeTab === 'longevity' ? 'active' : ''}" onclick="switchTab('longevity')">
                            <i data-lucide="dna" class="w-4 h-4 inline-block mr-2 text-purple-400"></i>${t.tabLongevity}
                        </button>
                    </div>
                </div>
            `;

            let content = '';

            if (state.activeTab === 'cohort') {
                let scanProgress = state.cohortStatus === 'COMPLETE' ? 100 : (state.cohortStatus === 'PROCESSING' ? (state.scannedCount / Math.max(state.scannedCount, 1)) * 100 : 0);
                
                content = `
                    <div class="glass-card" style="display: flex; flex-direction: column; gap: 30px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h2 style="font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; gap: 10px;">
                                    <i data-lucide="globe" class="w-6 h-6 inline-block text-emerald-400"></i>
                                    Реална FDA Фармакокинетика & Токсичност
                                </h2>
                                <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 6px; max-width: 650px;">
                                    Извличане на реални клинични доклади (Adverse Events) в реално време от базата на Агенцията по храните и лекарствата (САЩ) за компаунд <b>${state.fdaDrugName}</b>.
                                </p>
                            </div>
                            <button class="cure-btn" onclick="startCohortScan()" ${state.cohortStatus !== 'IDLE' ? 'disabled' : ''}>
                                <i data-lucide="${state.cohortStatus === 'COMPLETE' ? 'check-circle' : 'download-cloud'}" class="w-5 h-5 mr-2"></i>
                                ${state.cohortStatus === 'COMPLETE' ? t.btnScanStop : t.btnScan}
                            </button>
                        </div>

                        ${state.cohortStatus === 'SCANNING_FDA' ? `
                            <div style="padding: 20px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon-blue); border-radius: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: -10px;">
                                <i data-lucide="loader" class="w-6 h-6 text-blue-400 animate-spin"></i>
                                <span class="mono text-blue-400 font-bold">ОСЪЩЕСТВЯВАНЕ НА ВРЪЗКА С US FDA SERVERS (api.fda.gov)... ИЗВЛИЧАНЕ НА МАСИВИТЕ...</span>
                            </div>
                        ` : ''}

                        <!-- Progress Bar -->
                        <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 16px; border: 1px solid var(--emerald-border);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;" class="mono">
                                <span style="color: var(--text-secondary);">ОБРАБОТЕНИ РЕАЛНИ ДОКЛАДИ ОТ ПАЦИЕНТИ</span>
                                <span style="font-weight: 900; color: var(--neon-emerald); font-size: 1.2rem;">${state.scannedCount.toLocaleString()} РЕГИСТРИРАНИ СЛУЧАЯ</span>
                            </div>
                            <div style="width: 100%; height: 16px; background: rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden; position: relative;">
                                <div style="width: ${state.cohortStatus === 'COMPLETE' ? '100' : (state.scannedCount > 0 ? '50' : '0')}%; height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-emerald)); box-shadow: 0 0 20px var(--neon-emerald); transition: width 0.3s ease;"></div>
                            </div>
                        </div>

                        <!-- Stats Grid -->
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                            <div style="background: rgba(0, 255, 170, 0.05); border: 1px solid rgba(0, 255, 170, 0.2); border-radius: 16px; padding: 24px;">
                                <div style="font-size: 0.85rem; color: var(--text-secondary);" class="mono">ДОКЛАДВАНИ БЕЗ ТЕЖКА ОРГАННА ТОКСИЧНОСТ</div>
                                <div style="font-size: 2.5rem; font-weight: 900; color: var(--neon-emerald);" class="mono glow-text-emerald">
                                    ${state.safeCount.toLocaleString()}
                                </div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Базирано на OpenFDA данни</div>
                            </div>
                            
                            <div style="background: rgba(255, 59, 111, 0.05); border: 1px solid rgba(255, 59, 111, 0.2); border-radius: 16px; padding: 24px;">
                                <div style="font-size: 0.85rem; color: var(--text-secondary);" class="mono">ДОКАЗАНА ТЕЖКА ТОКСИЧНОСТ</div>
                                <div style="font-size: 2.5rem; font-weight: 900; color: var(--neon-red);" class="mono glow-text-red">
                                    ${state.toxicCount.toLocaleString()}
                                </div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Hepatotoxicity, Renal & Cardiac Failure</div>
                            </div>

                            <div style="background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 16px; padding: 24px;">
                                <div style="font-size: 0.85rem; color: var(--text-secondary);" class="mono">ПРЕДИКАТИВЕН C-INDEX</div>
                                <div style="font-size: 2.5rem; font-weight: 900; color: var(--neon-blue);" class="mono glow-text-blue">
                                    ${state.cIndex.toFixed(3)}
                                </div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Точност спрямо FDA стандарти</div>
                            </div>
                        </div>

                        ${state.cohortStatus === 'COMPLETE' ? `
                        <div style="padding: 20px; background: rgba(0, 255, 170, 0.1); border: 1px solid var(--neon-emerald); border-radius: 16px; display: flex; align-items: center; gap: 16px;">
                            <i data-lucide="activity" class="w-10 h-10 text-emerald-400"></i>
                            <div>
                                <h4 style="color: var(--neon-emerald); font-weight: 800; font-size: 1.1rem; margin-bottom: 4px;">FDA ДАННИТЕ СА УСПЕШНО ИНТЕГРИРАНИ</h4>
                                <p style="font-size: 0.85rem; color: #b2ccd6;">
                                    AETERNA успешно извлече и анализира ${state.scannedCount.toLocaleString()} реални пациентски досиета от базите на FDA за Dasatinib. 
                                    Отчетени са ${state.toxicCount.toLocaleString()} случая на тежка системна токсичност. Системата е готова за препрограмиране на компаунда.
                                </p>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            } else if (state.activeTab === 'longevity') {
                content = `
                    <div class="glass-card purple-variant" style="display: flex; flex-direction: column; gap: 30px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h2 style="font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; gap: 10px;">
                                    <i data-lucide="dna" class="w-6 h-6 inline-block text-purple-400"></i>
                                    Геномна Редакция & Епигенетика
                                </h2>
                                <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 6px; max-width: 600px;">
                                    Първо: CRISPR-Cas9 редакция на дефектни гени (APOE4 -> APOE3). 
                                    Второ: Индукция на Yamanaka фактори (OSKM) за реверсия на възрастта.
                                </p>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                ${state.longStatus === 'BASELINE' || state.longStatus === 'CRISPR_EDITING' ? `
                                <button class="cure-btn" style="background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);" onclick="triggerCrispr()" ${state.longStatus === 'CRISPR_EDITING' ? 'disabled' : ''}>
                                    <i data-lucide="scissors" class="w-5 h-5 mr-2"></i>
                                    ${state.longStatus === 'CRISPR_EDITING' ? 'РЕДАКТИРАНЕ...' : t.btnCrispr}
                                </button>
                                ` : ''}

                                ${state.longStatus === 'CRISPR_DONE' || state.longStatus === 'REPROGRAMMING' ? `
                                <button class="cure-btn" style="background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); box-shadow: 0 0 35px rgba(181, 95, 230, 0.4);" onclick="triggerYamanaka()" ${state.longStatus === 'REPROGRAMMING' ? 'disabled' : ''}>
                                    <i data-lucide="zap" class="w-5 h-5 mr-2 text-white"></i>
                                    ${t.btnReprogram}
                                </button>
                                ` : ''}
                                
                                ${state.longStatus === 'REVERSED' ? `
                                <button class="tab-btn active" style="background: rgba(255, 59, 111, 0.1); border-color: var(--neon-red); color: var(--neon-red);" onclick="resetLongevity()">
                                    <i data-lucide="refresh-cw" class="w-5 h-5 mr-2"></i>
                                    ${t.btnReset}
                                </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- CRISPR DNA Sequence Bar -->
                        <div style="background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 12px; border: 1px solid ${state.longStatus === 'BASELINE' ? 'var(--neon-red)' : (state.longStatus === 'CRISPR_EDITING' ? 'var(--neon-blue)' : 'var(--neon-emerald)')}; display: flex; align-items: center; justify-content: space-between;">
                            <div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px;" class="mono uppercase tracking-widest">Анализ на ГЕНА: APOE (rs429358)</div>
                                <div class="mono" style="font-size: 1.2rem; letter-spacing: 2px;">
                                    ${state.dnaSequence}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px;" class="mono uppercase tracking-widest">Клиничен Риск</div>
                                <div class="mono font-bold" style="color: ${state.longStatus === 'BASELINE' ? 'var(--neon-red)' : (state.longStatus === 'CRISPR_EDITING' ? 'var(--neon-blue)' : 'var(--neon-emerald)')};">
                                    ${state.dnaRisk}
                                </div>
                            </div>
                        </div>

                        <!-- Central Visualizer -->
                        <div style="display: flex; gap: 20px; align-items: stretch; opacity: ${state.longStatus === 'BASELINE' || state.longStatus === 'CRISPR_EDITING' ? '0.5' : '1'}; transition: opacity 0.5s;">
                            
                            <!-- Main Age Dial -->
                            <div style="flex: 1; background: rgba(0,0,0,0.4); border-radius: 16px; border: 1px solid var(--purple-border); padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">
                                <div style="position: absolute; top: -50px; left: -50px; width: 200px; height: 200px; background: radial-gradient(circle, var(--neon-purple) 0%, transparent 70%); opacity: ${state.yamanakaActive ? 0.3 : 0.05}; filter: blur(30px); transition: opacity 0.5s;"></div>
                                
                                <div style="font-size: 1rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 2px; margin-bottom: 10px;">БИОЛОГИЧНА ВЪЗРАСТ (HORVATH CLOCK)</div>
                                <div class="mono glow-text-blue" style="font-size: 5rem; font-weight: 900; color: ${state.longStatus === 'REVERSED' ? 'var(--neon-emerald)' : 'var(--neon-blue)'}; line-height: 1;">
                                    ${state.bioAge.toFixed(1)}
                                </div>
                                <div style="font-size: 1rem; color: #555; margin-top: 10px;" class="mono">ХРОНОЛОГИЧНА: 75.4 ГОДИНИ</div>

                                ${state.longStatus === 'REPROGRAMMING' ? `
                                    <div style="margin-top: 20px; color: var(--neon-pink); font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 8px;" class="animate-pulse">
                                        <i data-lucide="radio" class="w-4 h-4"></i> АКТИВЕН ЕПИГЕНЕТИЧЕН РЕМОДЕЛИРАЩ ВЕКТОР
                                    </div>
                                ` : ''}
                                
                                ${state.longStatus === 'BASELINE' || state.longStatus === 'CRISPR_EDITING' ? `
                                    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
                                        <div style="color: var(--neon-red); font-weight: bold; padding: 10px 20px; border: 1px solid var(--neon-red); border-radius: 8px; background: rgba(255,0,0,0.1);">
                                            <i data-lucide="lock" class="w-5 h-5 inline mr-2"></i>БЛОКИРАНО: ИЗИСКВА ДНК РЕДАКЦИЯ
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Biomarkers -->
                            <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
                                
                                <div style="flex: 1; background: rgba(181, 95, 230, 0.05); border: 1px solid rgba(181, 95, 230, 0.2); border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                                    <div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary);" class="mono">ДЪЛЖИНА НА ТЕЛОМЕРИТЕ</div>
                                        <div style="font-size: 2rem; font-weight: 900; color: var(--neon-purple);" class="mono">
                                            ${state.telomereLength.toFixed(2)} kbp
                                        </div>
                                        <div style="font-size: 0.75rem; color: #666;">(Оптимум: > 8.00 kbp)</div>
                                    </div>
                                    <i data-lucide="scissors" class="w-10 h-10 text-purple-500 opacity-50"></i>
                                </div>

                                <div style="flex: 1; background: rgba(255, 42, 133, 0.05); border: 1px solid rgba(255, 42, 133, 0.2); border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                                    <div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary);" class="mono">"ЗОМБИ" КЛЕТКИ (SENESCENT)</div>
                                        <div style="font-size: 2rem; font-weight: 900; color: ${state.longStatus === 'REVERSED' ? 'var(--neon-emerald)' : 'var(--neon-pink)'};" class="mono">
                                            ${state.senescentCells.toFixed(1)} %
                                        </div>
                                        <div style="font-size: 0.75rem; color: #666;">Спрямо изходно ниво (100%)</div>
                                    </div>
                                    <i data-lucide="skull" class="w-10 h-10 ${state.longStatus === 'REVERSED' ? 'text-emerald-500' : 'text-pink-500'} opacity-50"></i>
                                </div>

                            </div>
                        </div>

                        <!-- Yamanaka Factors Graph Visual -->
                        <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 16px; border: 1px solid var(--purple-border);">
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 15px; letter-spacing: 1px;">YAMANAKA ФАКТОРИ (OSKM) ЕКСПРЕСИЯ</div>
                            
                            <div style="display: flex; gap: 10px; align-items: flex-end; height: 100px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                                <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px;">
                                    <div style="width: 40px; background: var(--neon-blue); border-radius: 4px 4px 0 0; transition: height 0.5s;" style="height: ${state.yamanakaActive ? '85%' : '10%'};"></div>
                                    <span class="mono" style="font-size: 0.7rem;">OCT4</span>
                                </div>
                                <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px;">
                                    <div style="width: 40px; background: var(--neon-emerald); border-radius: 4px 4px 0 0; transition: height 0.5s;" style="height: ${state.yamanakaActive ? '95%' : '15%'};"></div>
                                    <span class="mono" style="font-size: 0.7rem;">SOX2</span>
                                </div>
                                <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px;">
                                    <div style="width: 40px; background: var(--neon-purple); border-radius: 4px 4px 0 0; transition: height 0.5s;" style="height: ${state.yamanakaActive ? '70%' : '5%'};"></div>
                                    <span class="mono" style="font-size: 0.7rem;">KLF4</span>
                                </div>
                                <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px;">
                                    <div style="width: 40px; background: var(--neon-pink); border-radius: 4px 4px 0 0; transition: height 0.5s;" style="height: ${state.yamanakaActive ? '60%' : '10%'};"></div>
                                    <span class="mono" style="font-size: 0.7rem;">c-MYC</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            }

            root.innerHTML = tabHeader + content;
            try {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            } catch (e) {
                console.error("Lucide icons failed to load:", e);
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            renderHUD();
        } else {
            window.onload = function() {
                renderHUD();
            };
        }

    </script>
</body>
</html>
